<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mendly{% endblock %}</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };
  </script>
  <style>.cols > * { break-inside: avoid; }</style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="mx-auto max-w-6xl px-4 sm:px-6 py-3 flex items-center gap-2">
      <div class="w-7 h-7 rounded-lg bg-blue-600 text-white flex items-center justify-center text-sm font-semibold">M</div>
      <span class="font-semibold">Mendly</span>
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-4 sm:px-6 py-5 sm:py-8 pb-12">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
