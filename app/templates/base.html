<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mendly{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Inter', 'system-ui', 'sans-serif'] },
      borderColor: { DEFAULT: 'rgba(148,163,184,.18)' }
    } } };
  </script>
  <link rel="stylesheet" href="/static/theme.css?v={{ asset_v() }}">
</head>
<body class="theme font-sans antialiased">
  <header class="topbar sticky top-0 z-20">
    <div class="mx-auto max-w-6xl px-4 sm:px-6 py-3 flex items-center gap-2.5">
      <div class="logo-tile"><img src="/static/logo.png" alt="Mendly"></div>
      <span class="font-semibold tracking-tight">Mendly</span>
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-4 sm:px-6 py-5 sm:py-8 pb-12">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
